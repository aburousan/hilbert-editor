# Diagnostic only. Answers the question a Mac can't: when tinymist is installed
# the way people actually install it on Windows — `winget install
# Myriad-Dreamin.Tinymist` — can Hilbert find it?
#
# winget drops the real executable in Packages/ under its release name and links
# to it from Links/, then adds Links/ to the stored user PATH. A program already
# running keeps the environment it started with, so an app the desktop launched
# before that change never sees the new entry. The three cases below cover what
# that leaves on disk, and the last one exists to prove the probe can still fail.

name: Windows probe

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch typst and tinymist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path stash, tools | Out-Null

          $url = gh api repos/Myriad-Dreamin/tinymist/releases/latest --jq '.assets[] | select(.name | test("win32-x64\\.exe$")) | .browser_download_url'
          if (-not $url) { throw "no tinymist windows asset found" }
          Write-Host "tinymist: $url"
          Invoke-WebRequest -Uri $url -OutFile stash\tinymist-win32-x64.exe

          $url = gh api repos/typst/typst/releases/latest --jq '.assets[] | select(.name | test("x86_64-pc-windows-msvc\\.zip$")) | .browser_download_url'
          if (-not $url) { throw "no typst windows asset found" }
          Write-Host "typst:    $url"
          Invoke-WebRequest -Uri $url -OutFile typst.zip
          Expand-Archive typst.zip -DestinationPath typst-unpacked
          Copy-Item (Get-ChildItem typst-unpacked -Filter typst.exe -Recurse | Select-Object -First 1).FullName tools\typst.exe
          & tools\typst.exe --version

      - name: Build the backend
        shell: pwsh
        run: |
          # tauri-build wants the frontend output to exist; the probe only talks
          # to the HTTP API, so a placeholder is enough and saves an npm build.
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content dist\index.html "<!doctype html><title>probe</title>"
          cargo build --manifest-path src-tauri\Cargo.toml --bin typst-editor
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Can Hilbert find a winget-installed tinymist?
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe   = "$PWD\src-tauri\target\debug\typst-editor.exe"
          $token = 'probe-token-long-enough-to-be-accepted-0123456789'
          $pkg   = "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\Myriad-Dreamin.Tinymist_Microsoft.Winget.Source_8wekyb3d8bbwe"
          $links = "$env:LOCALAPPDATA\Microsoft\WinGet\Links"

          # Whatever winget has already done to this runner would mask the very
          # thing being measured, so the process starts from a PATH with its
          # folders removed and each case puts back exactly what it wants tested.
          $basePath = ($env:PATH -split ';' | Where-Object {
            $_ -and ($_ -notlike "*\Microsoft\WinGet\*")
          }) -join ';'

          function Reset-Layout {
            Remove-Item -Recurse -Force $pkg, $links -ErrorAction SilentlyContinue
          }

          function Get-Status([string]$name, [int]$port) {
            $ws = "$PWD\ws-$name"
            New-Item -ItemType Directory -Force -Path $ws | Out-Null
            $out = "$PWD\$name.log"

            $env:PATH             = $basePath
            $env:HILBERT_API_TOKEN = $token
            $env:TYPST_WORKSPACE   = $ws
            $env:TYPST_DIST        = "$PWD\dist"
            # A port per case, never 0: the backend echoes back the port it was
            # asked for when the bind succeeds, so 0 would tell us nothing.
            $env:PORT              = "$port"

            $proc = Start-Process -FilePath $exe -PassThru -NoNewWindow `
              -ArgumentList '--headless','--session-file',"$PWD\$name.session.json" `
              -RedirectStandardOutput $out -RedirectStandardError "$PWD\$name.err.log"

            try {
              # The port it settled on is only knowable from what it prints.
              $port = $null
              foreach ($i in 1..60) {
                Start-Sleep -Milliseconds 500
                if (Test-Path $out) {
                  $m = Select-String -Path $out -Pattern 'http://127\.0\.0\.1:(\d+)' | Select-Object -First 1
                  if ($m) { $port = $m.Matches[0].Groups[1].Value; break }
                }
              }
              if (-not $port) { Get-Content $out, "$PWD\$name.err.log" -EA SilentlyContinue; throw "backend never reported a port" }

              foreach ($i in 1..30) {
                try {
                  return Invoke-RestMethod "http://127.0.0.1:$port/lsp/status" `
                    -Headers @{ Authorization = "Bearer $token" }
                } catch { Start-Sleep -Milliseconds 500 }
              }
              throw "backend never answered /lsp/status"
            } finally {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

          $failures = @()
          function Check([string]$name, [bool]$ok, [string]$detail) {
            if ($ok) { Write-Host "PASS  $name — $detail" }
            else { Write-Host "FAIL  $name — $detail"; $script:failures += $name }
          }

          # --- Case 1: winget made its shim, but it landed on PATH after launch.
          Reset-Layout
          New-Item -ItemType Directory -Force -Path $pkg, $links | Out-Null
          Copy-Item stash\tinymist-win32-x64.exe "$pkg\tinymist-win32-x64.exe"
          Copy-Item stash\tinymist-win32-x64.exe "$links\tinymist.exe"

          # This is the old behaviour, measured rather than assumed: `where.exe`
          # searches exactly the PATH the app used to read.
          $env:PATH = $basePath
          $seen = (& cmd /c "where tinymist" 2>$null)
          Check 'control: unaugmented PATH cannot see it' ($LASTEXITCODE -ne 0) "where.exe -> $(if ($seen) { $seen } else { 'not found' })"

          $s = Get-Status 'shim' 3141
          Check 'case 1: shim in Links, absent from PATH' ([bool]$s.available) "available=$($s.available) source=$($s.source) path=$($s.path)"

          # --- Case 2: no symlink privilege, so only the package folder exists.
          Reset-Layout
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item stash\tinymist-win32-x64.exe "$pkg\tinymist-win32-x64.exe"

          $s = Get-Status 'packageonly' 3142
          Check 'case 2: package folder only, no shim' ([bool]$s.available) "available=$($s.available) source=$($s.source) path=$($s.path)"

          # --- Case 3: genuinely not installed. If this reports available, the
          # probe is finding something it shouldn't and cases 1-2 prove nothing.
          Reset-Layout
          $s = Get-Status 'absent' 3143
          Check 'case 3: not installed at all' (-not $s.available) "available=$($s.available) path=$($s.path)"

          Write-Host ''
          if ($failures.Count) { throw "failed: $($failures -join ', ')" }
          Write-Host 'All cases behaved as intended.'

      # Measurement, not a pass/fail gate. Windows users report that typing does
      # not reach the preview until they press save, or until several seconds
      # have gone by, and none of that reproduces on macOS or Linux. Two numbers
      # separate the possible causes: how long `typst watch` itself takes to
      # notice a write, and how long a round trip through Hilbert takes. If the
      # watcher is slower than the half second the preview waits for it, every
      # edit falls through to compiling directly and pays for both.
      - name: How long does an edit take to reach the PDF?
        shell: python
        run: |
          import json, os, queue, statistics, subprocess, threading, time, urllib.request
          from pathlib import Path

          root = Path.cwd()
          tools = root / "tools"
          os.environ["PATH"] = f"{tools};{os.environ['PATH']}"

          # Something with enough substance that compiling it is not free, in the
          # spirit of the projects people have reported this on.
          body = "\n".join(f"Line {i} with some text to typeset, $x_{{{i}}} = sqrt(2)$." for i in range(100))
          def document(marker):
              return f"= Probe {marker}\n\n{body}\n\n#rect(width: 4cm, height: 3cm)\n#rect(width: 4cm, height: 3cm)\n"

          def pump(stream, q):
              for line in iter(stream.readline, ""):
                  q.put(line.rstrip())
              q.put(None)

          def write_in_place(path, text):
              path.write_text(text, encoding="utf-8")

          def write_by_rename(path, text):
              # What the app does now, so the watcher sees exactly what it sees
              # in real use.
              tmp = path.with_suffix(".tmp-probe")
              tmp.write_text(text, encoding="utf-8")
              os.replace(tmp, path)

          def watch_reaction(label, writer, rounds=8):
              ws = root / f"watch-{label}"
              ws.mkdir(exist_ok=True)
              main, out = ws / "main.typ", ws / "out.pdf"
              writer(main, document("start"))
              proc = subprocess.Popen(
                  ["typst", "watch", "--root", str(ws), str(main), str(out)],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  text=True, encoding="utf-8", errors="replace", cwd=ws)
              q = queue.Queue()
              threading.Thread(target=pump, args=(proc.stdout, q), daemon=True).start()

              def wait_for_cycle(budget):
                  end = time.time() + budget
                  while time.time() < end:
                      try:
                          line = q.get(timeout=max(0.05, end - time.time()))
                      except queue.Empty:
                          return None
                      if line is None:
                          return None
                      if "compiled" in line.lower():
                          return line
                  return None

              try:
                  if not wait_for_cycle(60):
                      print(f"  {label}: watcher never produced a first compile")
                      return []
                  times = []
                  for i in range(rounds):
                      time.sleep(0.4)          # let it settle between edits
                      while not q.empty():     # drop anything left over
                          q.get_nowait()
                      start = time.time()
                      writer(main, document(f"edit-{i}"))
                      line = wait_for_cycle(10)
                      if line is None:
                          print(f"  {label}: edit {i} produced no cycle within 10s")
                          times.append(None)
                      else:
                          times.append((time.time() - start) * 1000)
                  return times
              finally:
                  proc.kill()

          print("typst watch reaction, write straight to the file:")
          in_place = watch_reaction("inplace", write_in_place)
          print(f"  {[None if t is None else round(t) for t in in_place]}")

          print("typst watch reaction, rename into place (what the app does):")
          renamed = watch_reaction("rename", write_by_rename)
          print(f"  {[None if t is None else round(t) for t in renamed]}")

          for label, times in (("in place", in_place), ("renamed", renamed)):
              good = [t for t in times if t is not None]
              missed = len(times) - len(good)
              if good:
                  print(f"  {label}: median {round(statistics.median(good))} ms, "
                        f"max {round(max(good))} ms, {missed} edits produced no cycle")
              else:
                  print(f"  {label}: no cycles at all ({missed} edits)")

          # --- Now the same edits through the running app.
          token = "probe-token-long-enough-to-be-accepted-0123456789"
          ws = root / "ws-latency"
          ws.mkdir(exist_ok=True)
          (ws / "main.typ").write_text(document("start"), encoding="utf-8")
          log = root / "latency.log"

          env = dict(os.environ, HILBERT_API_TOKEN=token, TYPST_WORKSPACE=str(ws),
                     TYPST_DIST=str(root / "dist"), PORT="3151")
          exe = root / "src-tauri" / "target" / "debug" / "typst-editor.exe"
          with open(log, "w") as sink:
              backend = subprocess.Popen(
                  [str(exe), "--headless", "--session-file", str(root / "latency.session.json")],
                  stdout=sink, stderr=subprocess.STDOUT, env=env)

          def api(path, data=None, headers=None):
              req = urllib.request.Request(
                  f"http://127.0.0.1:{port}{path}", data=data, method="POST" if data is not None else "GET")
              req.add_header("Authorization", f"Bearer {token}")
              for key, value in (headers or {}).items():
                  req.add_header(key, value)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.status, response.read()

          try:
              port = None
              for _ in range(60):
                  time.sleep(0.5)
                  text = log.read_text(errors="replace")
                  if "127.0.0.1:" in text:
                      port = text.split("127.0.0.1:")[1].split()[0].strip()
                      break
              if not port:
                  print(log.read_text(errors="replace"))
                  raise SystemExit("backend never reported a port")

              print(f"\nround trip through Hilbert (port {port}):")
              latencies = []
              for i in range(8):
                  time.sleep(0.4)
                  text = document(f"app-edit-{i}")
                  start = time.time()
                  api("/workspace/file?path=main.typ", text.encode(),
                      {"Content-Type": "text/plain"})
                  status, pdf = api("/compile?main=main.typ", b"")
                  elapsed = (time.time() - start) * 1000
                  latencies.append(elapsed)
                  print(f"  edit {i}: {round(elapsed)} ms, {status}, {len(pdf)} bytes")
              print(f"  median {round(statistics.median(latencies))} ms, "
                    f"max {round(max(latencies))} ms")
          finally:
              backend.kill()
