# Nginx in front of a Hilbert hosted workspace: TLS outside, plain HTTP to
# 127.0.0.1:3001 inside. Drop this in /etc/nginx/sites-available and symlink it.
#
# Two of these lines are load-bearing, not boilerplate. Getting either wrong
# gives a site that loads and then refuses everything you click.

server {
    listen 80;
    server_name hilbert.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hilbert.example.org;

    ssl_certificate     /etc/letsencrypt/live/hilbert.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hilbert.example.org/privkey.pem;

    # A PDF preview of a long document, or an image dropped into the project.
    client_max_body_size 128m;

    location / {
        proxy_pass http://127.0.0.1:3001;

        # Load-bearing. Hilbert checks a request's Origin against its Host, so a
        # rewritten Host makes every browser request cross-site and the answer is
        # 403 Forbidden: cross-site request. proxy_set_header Host $host is the
        # one thing you must not "fix" to the upstream name.
        proxy_set_header Host $host;

        # Load-bearing too. This is how the app knows the visitor arrived over
        # TLS: it decides whether the session cookie is marked Secure and whether
        # the collaboration relay is offered as wss:// or ws://.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The collaboration relay is a WebSocket that stays open for as long as
        # someone has the document open, and it is silent while nobody types.
        # Without the long read timeout nginx closes it every 60 seconds and
        # everyone's editor reconnects in a loop.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Compile output streams back as it is produced.
        proxy_buffering off;
    }
}
