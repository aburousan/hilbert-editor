[package]
name = "hilbert-editor"
version = "0.2.7"
description = "Hilbert — an offline editor for Typst (Unofficial), aimed at maths/physics writing."
repository = "https://github.com/aburousan/hilbert-editor"
homepage = "https://github.com/aburousan/hilbert-editor"
readme = "../README.md"
keywords = ["typst", "editor", "latex", "physics", "math"]
categories = ["text-editors", "science"]
authors = ["Kazi Abu Rousan"]
license = "MIT"
edition = "2024"
# Let chains need 1.88, and the typst and burn crates harper pulls in need
# 1.89 — declaring less holds those back at older versions.
rust-version = "1.92"
default-run = "hilbert"
# What `cargo publish` sends. ui-dist is the built interface, copied in by
# scripts/publish-crate.mjs before publishing and never committed.
include = [
    "src/**/*",
    "build.rs",
    "tauri.conf.json",
    "icons/**/*",
    "gen/**/*",
    "linux/**/*",
    "ui-dummy/**/*",
    "ui-dist/**/*",
]

[[bin]]
name = "hilbert"
path = "src/main.rs"

[features]
# For `cargo install --git`: build the interface with npm and carry it inside
# the binary. The published crate already carries it and needs no feature.
embed-ui = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
include_dir = "0.7"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No provider feature of our own: rustls is already in the tree with ring, and
# asking for reqwest's default provider instead would drag in aws-lc-rs, which
# wants cmake and NASM to build on Windows. Roots come from the platform
# verifier — the machine's own trust store, so a certificate the user or their
# workplace has added works here as it does in their browser.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
# ...and the provider itself, chosen here rather than left to reqwest, which
# would pick aws-lc-rs. Installed once at startup by `use_ring()`.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
regex = "1"
base64 = "0.23"
sha2 = "0.11"
getrandom = "0.4"
dirs = "6"
mime_guess = "2"
percent-encoding = "2"
open = "5"
# The system clipboard. Monaco's Cut/Copy/Paste menu entries go through
# document.execCommand, which a webview refuses — paste in particular can never
# work that way — so the editor's clipboard is served from here instead.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# Spreadsheet reading (xlsx/xls/xlsb/ods) so data import can convert Excel files
# to CSV offline, with no runtime dependency on Excel or Python.
calamine = "0.36"
# Pure-Rust zip writer for archiving a project on export — works identically on
# Windows/macOS/Linux with no dependency on a system `zip` binary.
zip = { version = "8", default-features = false, features = ["deflate"] }

# Proofreading: spellbook is a pure-Rust, Nuspell/Hunspell-compatible spell
# checker; harper-core + harper-typst provide native grammar/style linting that
# understands Typst syntax (prose only, skipping code/math).
spellbook = "0.4"
# Downloaded dictionaries are not all UTF-8 — German, Polish and Brazilian
# Portuguese are still Latin-1/Latin-2 — and a word list decoded wrongly reports
# every accented word in the language as a misspelling. Already in the tree via
# reqwest, so naming it here costs nothing.
encoding_rs = "0.8"
harper-core = "2.8"
harper-typst = "2.8"
typst = "=0.15.1"
typst-layout = "=0.15.1"
dunce = "1.0.5"
ttf-parser = "0.25.1"
unicode-normalization = "0.1.25"
typst-kit = { version = "=0.15.1", default-features = false, features = ["datetime", "embedded-fonts", "scan-fonts", "system-packages"] }
tauri-plugin-single-instance = "2.4.4"

# Keep this LAST: a [target.…] header ends [dependencies], so anything written
# below it would silently become unix-only.
[target.'cfg(unix)'.dependencies]
# Per-process resource limits (CPU time, max file size) applied to spawned
# Python/Julia code so a runaway cell can't fill the disk or peg a core.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The Dock menu. Tauri has no hook for it, so it is added to the app delegate
# directly; these are the versions the windowing layer already builds.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }

[target.'cfg(windows)'.dependencies]
# The taskbar jump list, through the shell's COM interfaces. The version Tauri
# already builds.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
codegen-units = 1
lto = true
# Size, measured rather than assumed. Against `opt-level = 3` on this codebase:
# the binary is 50.1 MB rather than 53.1 MB, and the only thing that runs slower
# is building the proofreading dictionaries once per session, 450 ms against
# 330 ms. Everything a writer waits on — a lint after an edit (3 ms), the
# double-click jump (3 ms), the file tree, search — measures the same either
# way, so the three megabytes of download are worth more than the 120 ms.
opt-level = "s"
strip = true
# Panics unwind rather than abort. The backend runs the proofreader, the
# watcher and the language server on their own threads, and every one of those
# call sites already treats failure as "no result this time" — but only if the
# thread is allowed to fail. Aborting turns a bad line of prose into a dead
# editor with the user's unsaved work in it, which is how a crash was reported
# during proofreading. The cost is a slightly larger binary.
